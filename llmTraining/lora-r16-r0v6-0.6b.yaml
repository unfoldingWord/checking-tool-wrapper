# R0v6 of plans/improve-single-prompt.md: the release candidate, trained on all the data except the
# benchmark (the first 835 TEST checks plus Arabic Luke: ne_glt_2co ne_glt_tit bn_glt_eph es-419_est_rut
# en_ult_tit ar_avd_luk), with R0v5's settings (app's prompt after c074e87, lowercase history). Data:
#   LLM_FINETUNE_TEST_PROJECTS="ne_glt_2co ne_glt_tit bn_glt_eph es-419_est_rut en_ult_tit ar_avd_luk" \
#     LLM_FINETUNE_INCLUDE=noRelatedWordInHistory LLM_FINETUNE_NO_HISTORY_SHARE=0.1 \
#     LLM_FINETUNE_OUT_DIR=llmTrainingData/finetune-r0v6 npm run build:finetune-data
# Train from the repo folder:
#   llmTraining/.venv/bin/mlx_lm.lora --config llmTraining/lora-r16-r0v6-0.6b.yaml
# iters = 26,943 train examples x 2 epochs / 8 = 6,736.
model: Qwen/Qwen3-0.6B
train: true
data: llmTrainingData/finetune-r0v6      # train.jsonl, valid.jsonl, test.jsonl
fine_tune_type: lora
num_layers: -1                        # LoRA on every layer
lora_parameters:
  rank: 16
  scale: 1.0                          # = lora_alpha / rank (alpha 16, as in Appendix A); 20 with lr 2e-4 broke the model
  dropout: 0.0
  keys: ["self_attn.q_proj", "self_attn.k_proj", "self_attn.v_proj", "self_attn.o_proj",
         "mlp.gate_proj", "mlp.up_proj", "mlp.down_proj"]
mask_prompt: true                     # loss on the assistant answer only (checked by check_data.py)
max_seq_length: 2048
batch_size: 8
iters: 6736
learning_rate: 2e-4
lr_schedule:
  name: cosine_decay
  warmup: 100
  arguments: [2e-4, 6636, 0]          # [initial lr, decay steps (iters - warmup), final lr]
grad_checkpoint: true
steps_per_report: 20
steps_per_eval: 200
val_batches: 50
save_every: 200
adapter_path: llmTraining/outputs/lora-r16-r0v6-0.6b
seed: 3407
